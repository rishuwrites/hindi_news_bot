name: serial-recaps
on:
  schedule:   # 03:30 IST: picks up last night's episodes; each recap is uploaded private and auto-publishes at its show's morning slot (06:30-10:00 IST)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      only_show:
        description: "Which show (all = every show)"
        type: choice
        default: all
        options: [all, kaisi, bhabhi, sohni, rimjhim, mannsundar, atisundar, patibrahma, ishq]
      video_id:
        description: "Optional: a specific Dangal TV episode video ID (e.g. JNdlYnNneKE) instead of the newest one"
        type: string
        default: ""
      publish_now:
        description: "Publish immediately (off = schedule at the show's morning slot)"
        type: boolean
        default: true
      upload:
        description: "Upload to YouTube (off = only make the video)"
        type: boolean
        default: true
      test_mode:
        description: "Quick test: 3 scenes, never uploads"
        type: boolean
        default: false
permissions: {contents: write}
jobs:
  recap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        show: [kaisi, bhabhi, sohni, rimjhim, mannsundar, atisundar, patibrahma, ishq]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - id: chk
        run: |
          S="${{ inputs.only_show }}"
          if [ -z "$S" ] || [ "$S" = "all" ] || [ "$S" = "${{ matrix.show }}" ]; then echo "run=true" >> $GITHUB_OUTPUT; else echo "run=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.run == 'true'
        with: {python-version: "3.12", cache: pip}
      - name: Install
        if: steps.chk.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          pip install -r requirements.txt
      - name: Make recap and upload
        if: steps.chk.outputs.run == 'true'
        run: python serial/smain.py
        env:
          SHOW_KEY: ${{ matrix.show }}
          EVENT_NAME: ${{ github.event_name }}
          VIDEO_ID: ${{ inputs.video_id }}
          PUBLISH_NOW: ${{ inputs.publish_now }}
          DO_UPLOAD: ${{ inputs.upload }}
          TEST_MODE: ${{ inputs.test_mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY }}
          SERIAL_CHANNEL_NAME: ${{ vars.SERIAL_CHANNEL_NAME }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.chk.outputs.run == 'true'
        with:
          name: recap-${{ matrix.show }}
          path: |
            output_s/*.json
            output_s/*.jpg
            output_s/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Save state
        if: always() && steps.chk.outputs.run == 'true'
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          [ -f "serial/state/${{ matrix.show }}.json" ] && git add "serial/state/${{ matrix.show }}.json"
          git commit -m "serial state ${{ matrix.show }}" || { echo "nothing to save"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((RANDOM % 8 + 3)); done
