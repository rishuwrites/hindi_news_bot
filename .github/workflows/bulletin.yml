name: news-bulletin-long
on:
  schedule:   # job starts ~2 hours before the slot; video is uploaded private and auto-publishes exactly at the slot
    - cron: "30 23 * * *"   # 05:00 IST -> publishes 07:00 IST
    - cron: "30 11 * * *"   # 17:00 IST -> publishes 19:00 IST
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish immediately (turn off to schedule at next 7 AM / 7 PM slot)"
        type: boolean
        default: true
      upload:
        description: "Upload to YouTube (turn off to only make the video)"
        type: boolean
        default: true
      test_mode:
        description: "Quick test: 2-3 stories (~2-3 min), never uploads"
        type: boolean
        default: false
permissions: {contents: write}
concurrency: {group: bulletin, cancel-in-progress: false}
jobs:
  bulletin:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          pip install -r requirements.txt
      - name: Make bulletin and upload
        run: python bulletin/bmain.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_NOW: ${{ inputs.publish_now }}
          DO_UPLOAD: ${{ inputs.upload }}
          TEST_MODE: ${{ inputs.test_mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulletin
          path: |
            output_b/*.json
            output_b/*.jpg
            output_b/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          for f in bulletin/history.json bulletin/slots.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "bulletin state" || { echo "nothing to save"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
